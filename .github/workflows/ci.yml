name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned deliberately — `stable` is a moving target, not a version.
  # rustc 1.98.0 (2026-08-18) started passing `-Wl,--fix-cortex-a53-843419`
  # when it links an aarch64 cdylib. zig 0.13.0, the cross-linker
  # cargo-lambda drives, rejects that flag outright ("error: unsupported
  # linker arg") and cargo-zigbuild 0.20.1 does not filter it, so
  # `crc-fast` — a cdylib reached through aws-smithy-checksums — fails to
  # compile and takes every Lambda binary in the build with it.
  #
  # This is not theoretical: on 2026-08-20 the platform repo shipped at
  # 15:12 and failed at 17:36 on an identical lockfile, because a
  # cold-booted runner resolved `stable` to the new compiler. Warm
  # runners kept working, so it looked intermittent.
  #
  # Unpin only with a cargo-lambda/zig bump that filters the flag, and
  # prove it on a cold runner. Mirrors MabrokaMedia/davoxi-backend#777.
  RUST_TOOLCHAIN: "1.97.1"

jobs:
  check:
    name: Check, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy lint
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test
